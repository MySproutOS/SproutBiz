name: Deploy SPAs

on:
  push:
    branches: [main]
    paths:
      - "apps/frontends/dashboard/**"
      - "apps/frontends/admin/**"
      - "lib/typescript/ui/**"
      - "lib/typescript/api-client/**"
  workflow_dispatch:
    inputs:
      spa:
        description: "Which SPA to deploy"
        required: true
        type: choice
        options:
          - all
          - dashboard
          - admin

env:
  NPM_CONFIG_FUND: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'apps/frontends/dashboard/**'
              - 'lib/typescript/ui/**'
              - 'lib/typescript/api-client/**'
            admin:
              - 'apps/frontends/admin/**'
              - 'lib/typescript/ui/**'
              - 'lib/typescript/api-client/**'

  deploy-dashboard:
    name: Deploy Dashboard
    needs: changes
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.spa == 'dashboard' || inputs.spa == 'all')) ||
        (github.event_name == 'push' && needs.changes.outputs.dashboard == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          max-age: 1w
          max-files: 50
          max-size: 3gb
      - name: Build Dashboard
        # Vite inlines these at build time, so they cannot be supplied at runtime.
        env:
          VITE_SPA_BASE_URL: https://static.forum.sproutos.me
          VITE_PUBLIC_MEDIA_BASE_URL: https://media.forum.sproutos.me
        run: pnpm exec turbo run build --filter=dashboard
      - name: Publish dashboard bundle to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          # Recent AWS CLI v2 sends CRC32 trailers that Garage rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          # Hashed assets are immutable and safe to cache forever. index.html is not: it is
          # the thing that points at the current hashes.
          #
          # No --delete: an open tab still holds the previous index.html and will keep asking
          # for the assets it names. Leaving them costs a little storage and avoids breaking
          # sessions mid-deploy; prune old bundles deliberately instead.
          aws s3 sync apps/frontends/dashboard/dist/ s3://static.forum/dashboard/ \
            --endpoint-url https://s3.forum.sproutos.me \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/frontends/dashboard/dist/index.html s3://static.forum/dashboard/index.html \
            --endpoint-url https://s3.forum.sproutos.me \
            --cache-control "no-cache"
          # No CDN invalidation step: Garage serves these directly, so there is no edge cache
          # to purge and no window where the two disagree.

  deploy-admin:
    name: Deploy Admin
    needs: changes
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && (inputs.spa == 'admin' || inputs.spa == 'all')) ||
        (github.event_name == 'push' && needs.changes.outputs.admin == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.4.2
        with:
          max-age: 1w
          max-files: 50
          max-size: 3gb
      - name: Build Admin
        # Vite inlines these at build time, so they cannot be supplied at runtime.
        env:
          VITE_SPA_BASE_URL: https://static.forum.sproutos.me
          VITE_PUBLIC_MEDIA_BASE_URL: https://media.forum.sproutos.me
        run: pnpm exec turbo run build --filter=admin
      - name: Publish admin bundle to Garage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: garage
          # Recent AWS CLI v2 sends CRC32 trailers that Garage rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          # Hashed assets are immutable and safe to cache forever. index.html is not: it is
          # the thing that points at the current hashes.
          #
          # No --delete: an open tab still holds the previous index.html and will keep asking
          # for the assets it names. Leaving them costs a little storage and avoids breaking
          # sessions mid-deploy; prune old bundles deliberately instead.
          aws s3 sync apps/frontends/admin/dist/ s3://static.forum/admin/ \
            --endpoint-url https://s3.forum.sproutos.me \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/frontends/admin/dist/index.html s3://static.forum/admin/index.html \
            --endpoint-url https://s3.forum.sproutos.me \
            --cache-control "no-cache"
          # No CDN invalidation step: Garage serves these directly, so there is no edge cache
          # to purge and no window where the two disagree.
