name: Release SproutBiz CLI

on:
  push:
    tags: ["biz-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli
      - name: Verify release metadata
        env:
          OAUTH_CLIENT_ID: ${{ vars.SPROUTBIZ_OAUTH_CLIENT_ID }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' packages/cli/Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "biz-v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          }
          test -n "$OAUTH_CLIENT_ID" || {
            echo "Repository variable SPROUTBIZ_OAUTH_CLIENT_ID is required" >&2
            exit 1
          }
      - name: Build
        env:
          SPROUTBIZ_OAUTH_CLIENT_ID: ${{ vars.SPROUTBIZ_OAUTH_CLIENT_ID }}
        run: cargo build --locked --release --target ${{ matrix.target }} --manifest-path packages/cli/Cargo.toml
      - name: Package
        run: |
          archive="biz-${{ matrix.target }}.tar.gz"
          tar -C "packages/cli/target/${{ matrix.target }}/release" -czf "$archive" biz
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: biz-${{ matrix.target }}
          path: |
            biz-${{ matrix.target }}.tar.gz
            biz-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: biz-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            biz-*.tar.gz
            biz-*.tar.gz.sha256
