# Deployed to /opt/forum/garage.toml. rpc_secret and admin_token are generated per-host with
# `openssl rand -hex 32` and filled in there; they are not committed.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

# Single node: this is one box, and replication across it would only cost disk.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "REPLACE_ME_OPENSSL_RAND_HEX_32"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.forum.sproutos.me"

[s3_web]
bind_addr = "[::]:3902"
# Garage picks the bucket by stripping this suffix from the Host header, so
# static.forum.sproutos.me resolves to bucket "static.forum" and media.forum.sproutos.me to
# "media.forum". That is why Traefik can pass the Host through untouched.
root_domain = ".sproutos.me"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "REPLACE_ME_OPENSSL_RAND_HEX_32"
