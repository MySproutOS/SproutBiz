[package]
name = "sproutbiz-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SproutBiz contribution agent dashboard"

[[bin]]
name = "biz"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
open = "5"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "form",
  "rustls",
  "stream",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.38"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
