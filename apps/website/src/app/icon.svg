<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A sprout: two leaves off a stem. Drawn as paths rather than the 🌱 emoji so it renders
       identically everywhere, including where the emoji font is missing, and stays legible at
       16px where emoji detail turns to mush. -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <path d="M16 25V14" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M16 14C16 9.6 12.6 6 8 6c0 4.4 3.4 8 8 8z" fill="#3fb950"/>
  <path d="M16 14c0-4.4 3.4-8 8-8 0 4.4-3.4 8-8 8z" fill="#56d364"/>
</svg>
